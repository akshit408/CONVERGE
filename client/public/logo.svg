<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradPublic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="gradEmerg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="gradMuni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gradEdu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring Base -->
  <circle cx="50" cy="50" r="44" stroke="#E2E8F0" stroke-width="3" fill="#FFFFFF"/>
  
  <!-- Converging Paths from 4 domains to central intelligent hub -->
  <!-- Public (Top Left) -->
  <path d="M 18 22 Q 35 35 50 50" stroke="url(#gradPublic)" stroke-width="5" stroke-linecap="round"/>
  <!-- Emergency (Top Right) -->
  <path d="M 82 22 Q 65 35 50 50" stroke="url(#gradEmerg)" stroke-width="5" stroke-linecap="round"/>
  <!-- Municipal (Bottom Left) -->
  <path d="M 18 78 Q 35 65 50 50" stroke="url(#gradMuni)" stroke-width="5" stroke-linecap="round"/>
  <!-- Education (Bottom Right) -->
  <path d="M 82 78 Q 65 65 50 50" stroke="url(#gradEdu)" stroke-width="5" stroke-linecap="round"/>

  <!-- Domain Location Nodes -->
  <circle cx="18" cy="22" r="5" fill="#2563EB" />
  <circle cx="82" cy="22" r="5" fill="#EF4444" />
  <circle cx="18" cy="78" r="5" fill="#F59E0B" />
  <circle cx="82" cy="78" r="5" fill="#8B5CF6" />

  <!-- Central Intelligence Node -->
  <circle cx="50" cy="50" r="10" fill="#0F172A" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="5" fill="#38BDF8" />
</svg>
